
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-backend
  template:
    metadata:
      labels:
        app: flask-backend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: flask-backend
          image: samrithaangel/flask-backend
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD

---
apiVersion: v1
kind: Service
metadata:
  name: flask-backend-service
spec:
  type: NodePort
  selector:
    app: flask-backend
  ports:
    - port: 5000
      targetPort: 5000

